spring.application.name=bff-web
server.port=8080

# URLs de microservicios (variables de entorno Docker, fallback a localhost para dev)
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8084}
services.mascotas.url=${SERVICES_MASCOTAS_URL:http://localhost:8081}
services.geo.url=${SERVICES_GEO_URL:http://localhost:8082}
services.matching.url=${SERVICES_MATCHING_URL:http://localhost:8083}

# JWT (mismo secreto que ms-auth)
jwt.secret=sanos-y-salvos-secret-key-must-be-at-least-256-bits-long-for-hs256

# CORS para React
spring.webflux.cors.allowed-origins=http://localhost:3000
spring.webflux.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE
spring.webflux.cors.allowed-headers=*

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

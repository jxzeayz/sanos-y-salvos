spring.application.name=bff-web
server.port=8080

# URLs de microservicios (variables de entorno Docker, fallback a localhost para dev)
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8084}
services.mascotas.url=${SERVICES_MASCOTAS_URL:http://localhost:8081}
services.geo.url=${SERVICES_GEO_URL:http://localhost:8082}
services.matching.url=${SERVICES_MATCHING_URL:http://localhost:8083}
services.notificaciones.url=${SERVICES_NOTIFICACIONES_URL:http://localhost:8085}
services.archivos.url=${SERVICES_ARCHIVOS_URL:http://localhost:8086}
services.auditoria.url=${SERVICES_AUDITORIA_URL:http://localhost:8087}

# JWT (sin valor por defecto: el servicio no debe arrancar si falta la variable de entorno)
jwt.secret=${JWT_SECRET}

# CORS para React (HTTP dev + HTTPS production)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://localhost}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE
cors.allowed-headers=Authorization,Content-Type

# Rate Limiting (global WebFilter, por IP)
bff.rate-limit.max-requests-per-minute=${RATE_LIMIT_MAX:100}
bff.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

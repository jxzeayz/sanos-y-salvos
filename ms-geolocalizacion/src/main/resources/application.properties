spring.application.name=ms-geolocalizacion
server.port=8082

# PostgreSQL con PostGIS
spring.datasource.url=jdbc:postgresql://localhost:5432/db_geo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA con Hibernate Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
rabbitmq.exchange=sanos-salvos.events

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.port=8085
spring.application.name=ms-notificaciones
spring.datasource.url=jdbc:postgresql://postgres-notificaciones:5432/db_notificaciones
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.exchange=sanos-salvos.events
rabbitmq.queue.notificaciones=q.notificaciones

# Reintentos antes de mandar un mensaje malformado al DLQ (evita el reencolado infinito)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:notificaciones@sanosysalvos.com}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Servicio de auth (para resolver el email del usuario al enviar notificaciones)
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8084}